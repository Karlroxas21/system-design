<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../dist/graphite.css"><title>Select — preview</title>
<style>
  body { margin: 0; }
  .demo { padding: 20px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .check { width: 16px; height: 16px; color: var(--openui-text-neutral-primary); }
</style>
</head>
<body class="openui-root">
<div class="demo">
  <button class="openui-select-trigger" data-placeholder>Choose a region<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  <div class="col">
    <button class="openui-select-trigger" data-state="open">US East (Virginia)<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="openui-select-content" role="listbox" aria-label="Region">
      <div class="openui-select-label">Regions</div>
      <div class="openui-select-item" role="option" aria-selected="true">US East (Virginia)<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="openui-select-item" role="option" data-highlighted>EU West (Ireland)</div>
      <div class="openui-select-item" role="option">Asia Pacific (Tokyo)</div>
    </div>
  </div>
</div>
</body>
</html>
