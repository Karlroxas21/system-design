<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../dist/graphite.css"><title>TextArea — preview</title>
<style>
  body { margin: 0; }
  .grid { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
</style>
</head>
<body class="openui-root">
<div class="grid">
  <textarea class="openui-textarea" id="ta-msg" rows="3" aria-label="Release notes">Fixed the export timeout on large workspaces and added CSV headers.</textarea>
  <textarea class="openui-textarea" id="ta-empty" rows="3" placeholder="Describe what changed for your customers" aria-label="Summary"></textarea>
</div>
</body>
</html>
