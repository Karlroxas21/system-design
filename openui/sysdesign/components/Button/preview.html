<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../dist/graphite.css"><title>Button — preview</title>
<style>
  body { margin: 0; }
  .demo { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
</style>
</head>
<body class="openui-root">
<div class="demo">
  <div class="row">
    <button class="openui-button-base openui-button-base-primary openui-button-base-medium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New project</button>
    <button class="openui-button-base openui-button-base-secondary openui-button-base-medium">Invite teammates</button>
    <button class="openui-button-base openui-button-base-tertiary openui-button-base-medium">Skip for now</button>
  </div>
  <div class="row">
    <button class="openui-button-base openui-button-base-destructive-primary openui-button-base-medium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>Delete project</button>
    <button class="openui-button-base openui-button-base-destructive-secondary openui-button-base-medium">Remove member</button>
    <button class="openui-button-base openui-button-base-destructive-tertiary openui-button-base-medium">Discard draft</button>
  </div>
  <div class="row">
    <button class="openui-button-base openui-button-base-primary openui-button-base-extra-small">Extra small</button>
    <button class="openui-button-base openui-button-base-primary openui-button-base-small">Small</button>
    <button class="openui-button-base openui-button-base-primary openui-button-base-medium">Medium</button>
    <button class="openui-button-base openui-button-base-primary openui-button-base-large">Large</button>
  </div>
  <div class="row">
    <button class="openui-button-base openui-button-base-primary openui-button-base-medium" disabled>Save changes</button>
    <button class="openui-button-base openui-button-base-secondary openui-button-base-medium" disabled>Export CSV</button>
  </div>
</div>
</body>
</html>
