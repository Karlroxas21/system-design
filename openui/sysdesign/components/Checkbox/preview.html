<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../dist/graphite.css"><title>Checkbox — preview</title>
<style>
  body { margin: 0; }
  .stack { padding: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 460px; }
</style>
</head>
<body class="openui-root">
<div class="stack">
  <label class="openui-checkbox-item-container"><input type="checkbox" class="openui-checkbox-item-root" id="cb-1" checked><span class="openui-item-content"><span class="openui-item-label">Email me a weekly summary</span></span></label>
  <label class="openui-checkbox-item-container"><input type="checkbox" class="openui-checkbox-item-root" id="cb-2"><span class="openui-item-content"><span class="openui-item-label">Include archived projects</span><span class="openui-item-description">Archived projects still count toward storage.</span></span></label>
  <label class="openui-checkbox-item-container"><input type="checkbox" class="openui-checkbox-item-root" id="cb-3" disabled><span class="openui-item-content"><span class="openui-item-label" style="color: var(--openui-text-neutral-tertiary)">Share with guests (Team plan)</span></span></label>
</div>
</body>
</html>
